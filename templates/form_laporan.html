<body>

<div class="panel">

    <!-- ==================================================
         HEADER
         ================================================== -->

    <div class="header">

        <div class="title">
            Form Laporan
        </div>

        <img
            src="{{ url_for('static', filename='logo.png') }}"
            class="logo"
            alt="NSG"
        >

    </div>


    <!-- ==================================================
         CONTENT
         ================================================== -->

    <div class="content">

        <div class="page-title">
            Input Laporan
        </div>

        <div class="member">
            Anggota:
            <strong>{{ nama }}</strong>
        </div>


        <!-- ==================================================
             FORM
             ================================================== -->

        <form
            method="POST"
            action="{{ url_for('form_anggota', nama=nama) }}"
            enctype="multipart/form-data"
        >


            <!-- ==================================================
                 TANGGAL
                 ================================================== -->

            <div class="form-group">

                <label for="tanggal">
                    Tanggal
                </label>

                <input
                    type="date"
                    id="tanggal"
                    name="tanggal"
                    required
                >

            </div>


            <!-- ==================================================
                 KETERANGAN
                 ================================================== -->

            <div class="form-group">

                <label for="keterangan">
                    Keterangan
                </label>

                <textarea
                    id="keterangan"
                    name="keterangan"
                    placeholder="Masukkan keterangan laporan..."
                    required
                ></textarea>

            </div>


            <!-- ==================================================
                 UPLOAD BUKTI
                 ================================================== -->

            <div class="form-group">

                <label>
                    Upload Bukti
                </label>


                <div
                    class="upload-box"
                    id="uploadBox"
                >

                    <div class="upload-icon">
                        📎
                    </div>

                    <div class="upload-title">
                        Drag & Drop file di sini Maximum: 10 MB per file.
                    </div>

                    <div class="upload-or">
                        atau
                    </div>

                    <button
                        type="button"
                        class="choose-file-button"
                        id="chooseFileButton"
                    >
                        PILIH FILE
                    </button>

                    <div class="upload-info">
                        Bisa upload satu atau beberapa file
                    </div>


                    <input
                        type="file"
                        id="fileInput"
                        name="files"
                        multiple
                        hidden
                    >

                </div>


                <!-- DAFTAR FILE -->

                <div
                    id="fileList"
                    class="file-list"
                ></div>

            </div>


            <!-- ==================================================
                 DEADLINE
                 ================================================== -->

            <div class="form-group">

                <label for="deadline">
                    Deadline
                </label>

                <input
                    type="date"
                    id="deadline"
                    name="deadline"
                >

            </div>


            <!-- ==================================================
                 STATUS
                 ================================================== -->

            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                >

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Progress">
                        Progress
                    </option>

                    <option value="Selesai">
                        Selesai
                    </option>

                </select>

            </div>


            <!-- ==================================================
                 BUTTON
                 ================================================== -->

            <div class="buttons">

                <a
                    href="{{ url_for('dashboard_anggota', nama=nama) }}"
                    class="button"
                >
                    BATAL
                </a>


                <button
                    type="submit"
                    class="button"
                >
                    SIMPAN KE LOGBOOK
                </button>

            </div>


            <!-- CATATAN -->

            <div class="file-note">
                File bukti dapat berupa satu atau beberapa file.dan mohon tunggu saat mengupload
            </div>


        </form>

    </div>

</div>


<!-- ==================================================
     JAVASCRIPT
     DRAG & DROP
     ================================================== -->

<script>

    const uploadBox =
        document.getElementById("uploadBox");

    const fileInput =
        document.getElementById("fileInput");

    const fileList =
        document.getElementById("fileList");

    const chooseFileButton =
        document.getElementById("chooseFileButton");


    /*
     * Array untuk menyimpan file
     * yang dipilih oleh pengguna.
     */

    let selectedFiles = [];


    /* ==================================================
       TOMBOL PILIH FILE
       ================================================== */

    chooseFileButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            fileInput.click();

        }
    );


    /* ==================================================
       KLIK AREA UPLOAD
       ================================================== */

    uploadBox.addEventListener(
        "click",
        function(event) {

            if (
                event.target === chooseFileButton
            ) {

                return;

            }

            fileInput.click();

        }
    );


    /* ==================================================
       FILE DIPILIH
       ================================================== */

    fileInput.addEventListener(
        "change",
        function() {

            addFiles(fileInput.files);

        }
    );


    /* ==================================================
       DRAG OVER
       ================================================== */

    uploadBox.addEventListener(
        "dragover",
        function(event) {

            event.preventDefault();

            uploadBox.classList.add(
                "dragover"
            );

        }
    );


    /* ==================================================
       DRAG LEAVE
       ================================================== */

    uploadBox.addEventListener(
        "dragleave",
        function(event) {

            /*
             * Pastikan class hanya dihapus
             * ketika benar-benar keluar
             * dari area upload.
             */

            if (
                !uploadBox.contains(
                    event.relatedTarget
                )
            ) {

                uploadBox.classList.remove(
                    "dragover"
                );

            }

        }
    );


    /* ==================================================
       DROP
       ================================================== */

    uploadBox.addEventListener(
        "drop",
        function(event) {

            event.preventDefault();

            uploadBox.classList.remove(
                "dragover"
            );

            addFiles(
                event.dataTransfer.files
            );

        }
    );


    /* ==================================================
       TAMBAHKAN FILE
       ================================================== */

    function addFiles(files) {

        for (
            let i = 0;
            i < files.length;
            i++
        ) {

            const file = files[i];


            /*
             * Cek apakah file sudah ada.
             */

            const alreadyExists =
                selectedFiles.some(
                    function(existingFile) {

                        return (
                            existingFile.name ===
                                file.name &&

                            existingFile.size ===
                                file.size &&

                            existingFile.lastModified ===
                                file.lastModified
                        );

                    }
                );


            if (!alreadyExists) {

                selectedFiles.push(file);

            }

        }


        updateFileInput();

        displayFiles();

    }


    /* ==================================================
       TAMPILKAN FILE
       ================================================== */

    function displayFiles() {

        fileList.innerHTML = "";


        selectedFiles.forEach(
            function(file, index) {

                const fileItem =
                    document.createElement("div");

                fileItem.className =
                    "file-item";


                /*
                 * Nama file
                 */

                const fileName =
                    document.createElement("div");

                fileName.className =
                    "file-name";

                fileName.textContent =
                    file.name +
                    " (" +
                    formatFileSize(
                        file.size
                    ) +
                    ")";


                /*
                 * Tombol hapus
                 */

                const removeButton =
                    document.createElement("button");

                removeButton.type =
                    "button";

                removeButton.className =
                    "remove-file";

                removeButton.textContent =
                    "HAPUS";


                removeButton.addEventListener(
                    "click",
                    function() {

                        removeFile(index);

                    }
                );


                fileItem.appendChild(
                    fileName
                );

                fileItem.appendChild(
                    removeButton
                );


                fileList.appendChild(
                    fileItem
                );

            }
        );

    }


    /* ==================================================
       HAPUS FILE
       ================================================== */

    function removeFile(index) {

        selectedFiles.splice(
            index,
            1
        );

        updateFileInput();

        displayFiles();

    }


    /* ==================================================
       UPDATE INPUT FILE
       ================================================== */

    function updateFileInput() {

        const dataTransfer =
            new DataTransfer();


        selectedFiles.forEach(
            function(file) {

                dataTransfer.items.add(
                    file
                );

            }
        );


        fileInput.files =
            dataTransfer.files;

    }


    /* ==================================================
       FORMAT UKURAN FILE
       ================================================== */

    function formatFileSize(bytes) {

        if (bytes < 1024) {

            return bytes + " B";

        }


        if (bytes < 1024 * 1024) {

            return (
                bytes / 1024
            ).toFixed(1) + " KB";

        }


        if (
            bytes <
            1024 * 1024 * 1024
        ) {

            return (
                bytes /
                (1024 * 1024)
            ).toFixed(1) + " MB";

        }


        return (
            bytes /
            (1024 * 1024 * 1024)
        ).toFixed(1) + " GB";

    }

</script>

</body>

</html>
