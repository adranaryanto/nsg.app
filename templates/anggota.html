<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Daftar Anggota</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 15px;

            min-height: 100vh;

            background-color: #b3b3b3;

            font-family: "Times New Roman", serif;

        }


        .panel {

            width: 600px;

            min-height: 450px;

            margin: 0 auto;

            background-color: white;

            border: 1px solid black;

        }


        /* HEADER */

        .header {

            height: 55px;

            background-color: #2f7d20;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 5px 10px;

        }


        .title {

            color: white;

            font-size: 24px;

            font-weight: bold;

        }


        .logo {

            width: 70px;

            height: 45px;

            object-fit: contain;

        }


        /* CONTENT */

        .content {

            padding: 25px;

        }


        .page-title {

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 20px;

        }


        /* ANGGOTA */

        .member {

            width: 100%;

            height: 55px;

            margin-bottom: 12px;

            border: 1px solid #555;

            background-color: #d9d9d9;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 15px;

            text-decoration: none;

            color: black;

            font-size: 18px;

        }


        .member:hover {

            background-color: #c5c5c5;

        }


        .arrow {

            font-size: 24px;

        }


        /* TAMBAH ANGGOTA */

        .add-title {

            margin-top: 30px;

            margin-bottom: 8px;

            font-size: 17px;

            font-weight: bold;

        }


        .add-form {

            display: flex;

            gap: 8px;

        }


        .add-form input {

            flex: 1;

            height: 32px;

            border: 1px solid #555;

            background-color: #eeeeee;

            padding: 5px;

            font-family: "Times New Roman", serif;

            font-size: 15px;

        }


        .add-form button {

            width: 100px;

            border: 1px solid #245d19;

            background-color: #2f7d20;

            color: white;

            font-family: "Times New Roman", serif;

            font-size: 15px;

            cursor: pointer;

        }


        .add-form button:hover {

            background-color: #256619;

        }


        /* =========================
           BUTTON NAVIGASI
        ========================= */

        .navigation-buttons {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 30px;

            gap: 10px;

        }


        .menu-button {

            display: inline-block;

            height: 32px;

            padding: 0 15px;

            background-color: #2f7d20;

            border: 1px solid #245d19;

            color: white;

            text-align: center;

            line-height: 30px;

            text-decoration: none;

            font-size: 15px;

        }


        .menu-button:hover {

            background-color: #256619;

        }


        /* LOGOUT */

        .logout {

            display: inline-block;

            width: 100px;

            height: 32px;

            background-color: #2f7d20;

            border: 1px solid #245d19;

            color: white;

            text-align: center;

            line-height: 30px;

            text-decoration: none;

            font-size: 15px;

        }


        .logout:hover {

            background-color: #256619;

        }


        /* MOBILE */

        @media (max-width: 600px) {

            .panel {

                width: 100%;

            }


            .add-form {

                flex-direction: column;

            }


            .add-form button {

                width: 100%;

                height: 32px;

            }


            .navigation-buttons {

                flex-direction: column;

                align-items: stretch;

            }


            .menu-button,
            .logout {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<div class="panel">


    <!-- HEADER -->

    <div class="header">

        <div class="title">

            Form Laporan

        </div>


        <img
            src="{{ url_for('static', filename='logo.png') }}"
            class="logo"
            alt="NSG"
        >

    </div>


    <!-- CONTENT -->

    <div class="content">


        <div class="page-title">

            Daftar Anggota

        </div>


        <!-- ==================================
             DAFTAR ANGGOTA OTOMATIS
             ================================== -->

        {% for member in members %}

        <a
            href="{{ url_for('dashboard_anggota', nama=member) }}"
            class="member"
        >

            <span>
                {{ member }}
            </span>

            <span class="arrow">
                &gt;
            </span>

        </a>

        {% endfor %}


        <!-- ==================================
             TAMBAH ANGGOTA
             ================================== -->

        <div class="add-title">

            Tambah Anggota

        </div>


        <form
            action="{{ url_for('tambah_anggota') }}"
            method="POST"
            class="add-form"
        >

            <input
                type="text"
                name="nama"
                placeholder="Masukkan nama anggota"
                required
            >

            <button type="submit">

                TAMBAH

            </button>

        </form>


        <!-- ==================================
             NAVIGASI
             ================================== -->

        <div class="navigation-buttons">


            <!-- KEMBALI KE MENU -->

            <a
                href="{{ url_for('menu_utama') }}"
                class="menu-button"
            >

                ← Kembali ke Menu

            </a>


            <!-- LOGOUT -->

            <a
                href="{{ url_for('logout') }}"
                class="logout"
            >

                LOGOUT

            </a>


        </div>


    </div>

</div>


</body>

</html>
